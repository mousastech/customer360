resources:
  apps:
    customer360:
      name: customer360
      description: "Customer 360 — Apps + Lakebase capstone"

      # --- Git-source app: Databricks pulls source from GitHub on each bundle run ---
      # Do NOT also set a top-level source_code_path — DABs rejects
      # "both git_source and source_code_path are set".
      git_repository:
        provider: gitHub
        url: ${var.git_repo_url}
      git_source:
        branch: ${var.git_branch}
        source_code_path: app

      # --- App resources: bind provisioned infra so env vars resolve at runtime ---
      resources:
        - name: sql_warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: lakebase
          database:
            instance_name: ${var.lakebase_instance}
            database_name: ${var.lakebase_database}
            permission: CAN_CONNECT_AND_CREATE
        - name: genie_space
          genie_space:
            name: genie_space
            space_id: ${var.genie_space_id}
            permission: CAN_RUN
        - name: forward_etl_job
          job:
            id: ${resources.jobs.forward_etl.id}
            permission: CAN_MANAGE_RUN

      # --- OBO scopes: only sql + dashboards.genie are accepted by the Apps API ---
      user_api_scopes:
        - sql
        - dashboards.genie
